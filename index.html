
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#008C53">
  <title>ZaynPay Mobile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    #header {
      height: 48px;
      background: #008C53;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      padding-top: env(safe-area-inset-top);
    }

    #header button {
      background: white;
      color: #008C53;
      border: 0;
      border-radius: 6px;
      padding: 7px 13px;
      font-weight: bold;
    }

    #frame {
      width: 100%;
      height: calc(100% - 48px);
      border: 0;
      display: block;
    }

    #loading {
      position: fixed;
      inset: 48px 0 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: white;
      color: #008C53;
      z-index: 2;
    }
  </style>
</head>

<body>

  <div id="header">
    <strong>ZaynPay</strong>
    <button onclick="reloadSite()">إعادة التحميل</button>
  </div>

  <div id="loading">جاري تحميل الموقع...</div>

  <iframe
    id="frame"
    src="https://portal.zaynpay.com/depositrequest"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <script>
    const frame = document.getElementById("frame");
    const loading = document.getElementById("loading");

    function reloadSite() {
      loading.style.display = "flex";
      frame.src = "https://portal.zaynpay.com/depositrequest";
    }

    frame.addEventListener("load", () => {
      loading.style.display = "none";
    });
  </script>

</body>
</html>
